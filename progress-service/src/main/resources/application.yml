server:
  port: ${PORT:8089}

spring:
  application:
    name: progress-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lms_progress}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:Shareef@1234}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:1}
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  cache:
    type: redis

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 60000

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: progress-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: java.util.HashMap   # ✅ same as course service
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

topics:
  progress: progress-events
  content: content-events
  batch-assignment: batch-assignment
  batch-lifecycle: batch-lifecycle

jwt:
  secret: ${JWT_SECRET:mysupersecretkeymysupersecretkey}
  expiration: ${JWT_EXPIRATION:3600000}

# =============================================================================
# Roadmap Upgraded feature — OpenAI config used to generate roadmaps.
# =============================================================================
roadmap-upgraded:
  openai:
    api-key: ${OPENAI_API_KEY}                                  # set as an env var, don't hardcode
    api-url: https://api.openai.com/v1/chat/completions
    model: gpt-4o-mini                                           # swap for whatever model tier you want to pay for
    connect-timeout-ms: 5000
    read-timeout-ms: 30000

  # ===========================================================================
  # Roadmap Upgraded feature — YouTube Data API v3 config, used to resolve a
  # real video ID for each AI-suggested video tutorial title.
  # ===========================================================================
  youtube:
    api-key: ${YOUTUBE_API_KEY}                                  # set as an env var, don't hardcode
    api-url: https://www.googleapis.com/youtube/v3/search
    connect-timeout-ms: 5000
    read-timeout-ms: 15000

logging:
  level:
    org.springframework.kafka: INFO
    com.lms.progress: INFO
    org.springframework.security: INFO