server:
  port: ${PORT:8084}

spring:
  application:
    name: video-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/videodb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:Shareef@1234}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  servlet:
    multipart:
      max-file-size: 4GB
      max-request-size: 4GB

  cache:
    type: redis

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: video-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: java.util.HashMap
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

video:
  upload-dir: videos

jwt:
  secret: ${JWT_SECRET:mysupersecretkeymysupersecretkey}
  expiration: ${JWT_EXPIRATION:3600000}

topics:
  video: video-uploaded
  batch-assignment: batch-assignment
  batch-lifecycle: batch-lifecycle
  content: content-events
  # NEW: featured-content session-video topics (must match course-service's application.yml exactly)
  featured-content: featured-content-events
  featured-program-lifecycle: featured-program-lifecycle
  featured-video-status: featured-video-status

app:
  # Same env var + same property path as chat-service (app.ffmpeg.path) --
  # both services point at one shared FFMPEG_PATH env var, no hardcoding here.
  ffmpeg:
    path: ${FFMPEG_PATH:ffmpeg}

  # Featured-session-video transcript generation (video-service only --
  # chat-service has no equivalent of this block).
  #
  # Transcription now happens via a persistent Python microservice
  # (transcribe_server.py, FastAPI + openai-whisper) instead of spawning a
  # fresh whisper CLI process per job. That microservice loads the model
  # ONCE at startup and stays warm, eliminating the per-job model-reload
  # cost that was dominating total time for short videos.
  #
  # Start it separately before running video-service:
  #   cd transcript-microservice
  #   pip install -r requirements.txt
  #   python transcribe_server.py
  # It listens on http://localhost:5001 by default.
  transcript:
    # Base URL of the running transcribe_server.py instance.
    microservice-url: ${TRANSCRIPT_MICROSERVICE_URL:http://localhost:5001}

    # Safety valve so ffmpeg extraction or the HTTP call to the
    # microservice can't hang forever.
    process-timeout-minutes: ${TRANSCRIPT_PROCESS_TIMEOUT_MINUTES:90}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.kafka: INFO