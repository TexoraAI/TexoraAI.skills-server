version: "3.8"

# -----------------------------------------------------------------------------
# All secrets now come from a single project-root ".env" file via `env_file`.
# Because this file is literally named ".env" and sits next to this compose
# file, Docker Compose ALSO uses it automatically for any ${VAR} substitution
# inside this file itself — so the two mechanisms can no longer disagree.
#
# `environment:` blocks below only contain values that legitimately differ
# by topology (internal hostnames, db names, JVM flags, profile) — never
# secrets, and never a renamed/aliased copy of a secret.
# -----------------------------------------------------------------------------

services:
  api-gateway:
    image: shareef123/api-gateway:latest
    container_name: api-gateway
    restart: always
    ports:
      - "9000:9000"
    depends_on:
      - kafka
      - redis
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx192m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
      SPRING_CODEC_MAX_IN_MEMORY_SIZE: 10485760
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      COURSE_SERVICE_URL: http://course-service:8083
      CONTENT_SERVICE_URL: http://course-service:8083
      VIDEO_SERVICE_URL: http://video-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      ANALYTICS_SERVICE_URL: http://analytics-service:8086
      ASSESSMENT_SERVICE_URL: http://assessment:8087
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8088
      PROGRESS_SERVICE_URL: http://progress-service:8089
      SEARCH_SERVICE_URL: http://search-service:8090
      PAYMENT_SERVICE_URL: http://payment-service:8091
      FILE_SERVICE_URL: http://file-service:8092
      STUDENT_SERVICE_URL: http://student-service:8093
      ATTENDANCE_SERVICE_URL: http://attendance-service:8094
      BATCH_SERVICE_URL: http://batch-service:8095
      CHAT_SERVICE_URL: http://chat-service:8096
      LIVE_SESSION_SERVICE_URL: http://live-session-service:8097

  auth-service:
